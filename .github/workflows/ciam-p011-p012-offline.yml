name: CIAM P0.11-P0.12 offline security gates
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository dependencies
        run: npm ci --ignore-scripts
      - name: Run BFF, v10 and additive deterministic tests
        run: ./scripts/ciam-v10.sh offline-test
      - name: Audit tracked source independently from runtime artifacts
        run: ./scripts/ciam-v10.sh security-audit
      - name: Refuse accidental patch whitespace
        run: git diff --check
